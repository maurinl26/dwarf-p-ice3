name: Build runpod image

on:
  push:
    branches: ["dev", "main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  runpod:
    name: Build and push runpod image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: container/Dockerfile
          target: runpod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:runpod
            ${{ env.IMAGE }}:runpod-${{ github.ref_name }}
          cache-from: type=gha,scope=runpod
          cache-to: type=gha,mode=max,scope=runpod
          provenance: false
