[project]
name = "dwarf-p-ice3"
version = "0.1.0"
description = "Phyex physics packages in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Loïc Maurin", email = "maurinl26@users.noreply.github.com" }
]
keywords = ["physics", "atmospheric-science", "jax", "numerical-simulation", "meteorology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Fortran",
]

dependencies = [
    "jax>=0.5.3",
    "flax>=0.10.2",
    "numpy<2.0",
    "scipy>=1.15.3",
    "typer>=0.15.2",
    "xarray[io]>=2025.4.0",
    "cython>=3.2.4"
]

[build-system]
build-backend = 'scikit_build_core.build'
requires = [
    'scikit-build-core>=0.10.0',
    'cython',
    'numpy<2.0',
]

[project.urls]
Homepage = "https://github.com/maurinl26/dwarf-p-ice3"
Documentation = "https://maurinl26.github.io/dwarf-p-ice3/"
Repository = "https://github.com/maurinl26/dwarf-p-ice3"
Issues = "https://github.com/maurinl26/dwarf-p-ice3/issues"

[project.scripts]
testprogs-data = "testprogs_data.main:app"
standalone-model = "drivers.cli:app"

[project.optional-dependencies]
gpu = [
    "cupy>=13.5.0",
    "cupy-xarray>=0.1.4",
]
test = [
    "pytest>=8.3.5",
    "pytest-benchmark>=5.1.0",
    "coverage>=7.12.0",
]
doc = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.19.0",
]
dev = [
    "dwarf-p-ice3[gt4py,test,doc]",
    "fprettify>=0.3.7",
    "isort>=6.0.1",
    "ruff>=0.11.11",
]

[tool.pytest.ini_options]
pythonpath = "src"
markers = [
    "debug: run on debug debug backend",
    "numpy: run on numpy backend",
    "cpu: run on dace:cpu backend",
    "gpu: run on dace:gpu backend",
    "dace: run on dace:cpu backend",
    "physics: standalone AROME JAX physics tests",
]

# Publishing to production PyPI (default)
# For test publishing, use: uv publish --index ice3-test
[[tool.uv.index]]
name = "ice3-test"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.sources]
dace = { git = "https://github.com/GridTools/dace.git", rev = "romanc/stree-to-sdfg" }

[tool.scikit-build]
cmake.version = ">=3.15"
cmake.build-type = "Release"

# Default build: CPU only, gfortran.
# GPU build (OpenACC + SURFEX): set environment overrides before pip install:
#
#   export SKBUILD_CMAKE_ARGS="-DCMAKE_Fortran_COMPILER=nvfortran;-DENABLE_OPENACC=ON;-DENABLE_SURFEX=ON"
#   pip install -e ".[gpu]"
#
cmake.args = [
    "-DCMAKE_Fortran_COMPILER=gfortran",
    "-G", "Unix Makefiles",
    "-DCMAKE_MAKE_PROGRAM=/usr/bin/make",
    "-DENABLE_OPENACC=OFF",
    "-DENABLE_SURFEX=OFF",
]

build.verbose = true
ninja.make-fallback = true
build-dir = "build/{wheel_tag}"

# CPU-only install components (default).
# GPU build adds surfex_acc + _surfex_wrapper_acc via SKBUILD_INSTALL_COMPONENTS.
install.components = [
    "ice_adjust_phyex",
    "_phyex_wrapper",
    "_phyex_wrapper_acc",
]

sdist.include = [
    "CMakeLists.txt",
    # PHYEX physics (microphysics, turbulence, convection)
    "external/PHYEX-IAL_CY50T1/**/*.F90",
    "external/PHYEX-IAL_CY50T1/**/*.f90",
    "external/PHYEX-IAL_CY50T1/**/*.h",
    "external/PHYEX-IAL_CY50T1/bridge/_phyex_wrapper.pyx",
    "external/PHYEX-IAL_CY50T1/bridge/_phyex_wrapper_acc.pyx",
    # SURFEX GPU bridge (OpenACC column-parallel surface physics)
    "external/open-SURFEX-V9-1-0/bridge/surfex_c_api_acc.F90",
    "external/open-SURFEX-V9-1-0/bridge/_surfex_wrapper_acc.pyx",
]

wheel.install-dir = "ice3"

[dependency-groups]
test = [
    "coverage-badge>=1.1.2",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=7.0.0",
    "fmodpy>=1.7.4",
]
